name: Update Starcraft Stats

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4

    - name: 파이썬 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필요 라이브러리 설치
      # jinja2 라이브러리를 추가로 설치합니다.
      run: |
        python -m pip install --upgrade pip
        pip install pandas gspread jinja2 openpyxl

    - name: 구글 시트 연동 및 통계 산출, 웹페이지 빌드
      env:
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      run: |
        python scripts/update_data.py
        python scripts/generate_stats.py
        python scripts/build_html.py

    - name: 변경된 데이터 및 HTML 깃허브에 배포
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add data/*.json index.html
        git diff --quiet && git diff --staged --quiet || git commit -m "🚀 통계 웹페이지 자동 업데이트"
        git push
